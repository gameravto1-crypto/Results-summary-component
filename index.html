<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Results summary component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="blue-container">
        <h1>Your Result</h1>
        <div class="average">
          <h2>76</h2>
          <h3>of 100</h3>
        </div>
        <p class="great">Great</p>
        <p class="description">
          you scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
      <div class="summary">
        <h2>Summary</h2>
        <div class="reaction">
          <div>
            <img src="./assets/images/icon-reaction.svg" alt="" />
            <p class="reaction-color">Reaction</p>
          </div>

          <p>80 <span>/ 100</span></p>
        </div>
        <div class="memory">
          <div>
            <img src="./assets/images/icon-memory.svg" alt="" />
            <h2 class="memory-color">Memory</h2>
          </div>
          <p class="p1">92 <span>/ 100</span></p>
        </div>
        <div class="verbal">
          <div>
            <img src="./assets/images/icon-verbal.svg" alt="" />
            <p class="verbal-modify">Verbal</p>
          </div>
          <p>61 <span>/ 100</span></p>
        </div>
        <div class="visual">
          <div>
            <img src="./assets/images/icon-visual.svg" alt="" />
            <p class="visual-modify">Visual</p>
          </div>
          <p>73 <span>/ 100</span></p>
        </div>
        <div class="button">
          <button>Continue</button>
        </div>
      </div>
    </div>
  </body>
</html>
